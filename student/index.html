<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学籍信息</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .header-banner {
      background: linear-gradient(120deg, #3498db, #2980b9);
    }
  </style>
</head>

<body class="bg-gray-100">
  <div class="container mx-auto px-4 py-2">
    <!-- 顶部 banner -->
    <div class="header-banner rounded-t-lg text-white p-4 mb-4">
      <h2 class="text-xl font-bold">考证现状</h2>
      <p class="text-sm">参与考证需求调研，分享备考经验，共筑高效考证指南</p>
    </div>

    <!-- 个人信息卡片 -->
    <div class="bg-green-500 text-white rounded-lg p-4 mb-4">
      <div class="flex items-center mb-4">
        <img src="https://example.com/your-photo.jpg" alt="录取照片" class="w-20 h-20 rounded mr-4">
        <div>
          <h3 class="text-2xl font-bold">王子雄</h3>
          <p>男 2002年03月21日</p>
        </div>
      </div>
      <div class="mb-2">
        <h4 class="text-xl font-bold">北京联合大学</h4>
        <p class="text-lg">金融学 | 普通全日制</p>
      </div>
      <span class="bg-green-600 text-white px-3 py-1 rounded-full text-sm">本科</span>
    </div>

    <!-- 详细信息列表 -->
    <div class="bg-white rounded-lg p-4 mb-4">
      <ul class="space-y-2">
        <li class="flex justify-between">
          <span class="text-gray-500">民族</span>
          <span>汉族</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">证件号码</span>
          <span>110115200203212014</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">学制</span>
          <span>2年</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">学历类别</span>
          <span>普通高等教育</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">分院</span>
          <span>应用科技学院</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">班级</span>
          <span>应科金融2501S</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">学号</span>
          <span>2025190403044</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">入学日期</span>
          <span>2025年09月01日</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">学籍状态</span>
          <span>在籍（注册学籍）</span>
        </li>
        <li class="flex justify-between">
          <span class="text-gray-500">预计毕业日期</span>
          <span>2027年07月01日</span>
        </li>
      </ul>
    </div>

    <!-- 按钮 -->
    <button class="w-full bg-green-500 text-white py-3 rounded-lg font-bold">查看验证报告</button>
  </div>
</body>

</html>
