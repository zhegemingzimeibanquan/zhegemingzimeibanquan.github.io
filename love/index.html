<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>here is the voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07070f;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            cursor: default;
        }

        /* ===== 星空背景 Canvas ===== */
        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            width: 560px;
            height: 560px;
            z-index: 1;
        }

        /* ===== 轨道环线 ===== */
        .orbit-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.04);
            pointer-events: none;
        }
        .orbit-ring.outer { width: 460px; height: 460px; }
        .orbit-ring.inner { width: 380px; height: 380px; border-color: rgba(255,255,255,0.03); }

        /* ===== 中心光球 ===== */
        .center-orb {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ff8fab, #c44569);
            box-shadow:
                0 0 40px rgba(196, 69, 105, 0.5),
                0 0 80px rgba(196, 69, 105, 0.25),
                inset 0 -10px 30px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .center-orb .orb-inner-glow {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
            pointer-events: none;
        }
        @keyframes orb-pulse {
            0%, 100% { box-shadow: 0 0 40px rgba(196,69,105,0.5), 0 0 80px rgba(196,69,105,0.25), inset 0 -10px 30px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 0 60px rgba(196,69,105,0.7), 0 0 120px rgba(196,69,105,0.35), inset 0 -10px 30px rgba(0,0,0,0.3); }
        }
        .center-orb.pulsing { animation: orb-pulse 2.5s ease-in-out infinite; }

        /* ===== 轨道光点 ===== */
        .orbit-point {
            position: absolute;
            top: 50%; left: 50%;
            width: 36px; height: 36px;
            margin: -18px 0 0 -18px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s ease;
        }
        .orbit-point .point-body {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            border-radius: 50%;
            transition: all 0.25s ease;
        }
        .orbit-point .point-inner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 14px; height: 14px;
            border-radius: 50%;
            z-index: 2;
            transition: all 0.25s ease;
        }
        .orbit-point .point-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            border-radius: 50%;
            opacity: 0.5;
            transition: all 0.3s ease;
        }
        .orbit-point .point-label {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .orbit-point:hover .point-label { opacity: 1; }
        .orbit-point:hover { z-index: 6; }
        .orbit-point:hover .point-body { transform: translate(-50%, -50%) scale(1.35); }
        .orbit-point:hover .point-inner { transform: translate(-50%, -50%) scale(1.2); }
        .orbit-point:hover .point-glow { opacity: 0.8; transform: translate(-50%, -50%) scale(1.4); }

        /* 正在播放 */
        .orbit-point.playing .point-glow {
            animation: playing-ring 0.8s ease-in-out infinite;
        }
        @keyframes playing-ring {
            0%, 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(2.0); opacity: 0.2; }
        }
        .orbit-point.playing .point-body { box-shadow: 0 0 20px currentColor !important; }
        .orbit-point.playing .point-inner { animation: playing-core 0.8s ease-in-out infinite; }
        @keyframes playing-core {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(0.7); }
        }

        /* ===== 底部提示 ===== */
        .footer-hint {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: rgba(255,255,255,0.25);
            font-size: 12px;
            letter-spacing: 3px;
            text-align: center;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        .footer-hint.dim { opacity: 0.15; }

        /* ===== 彩蛋弹窗 ===== */
        .egg-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
        }
        .egg-modal.active { display: flex; }
        .egg-card {
            position: relative;
            width: 330px;
            padding: 34px 30px 30px;
            border-radius: 18px;
            text-align: center;
            background: linear-gradient(160deg, rgba(30,20,45,0.95), rgba(12,8,24,0.98));
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow:
                0 0 40px rgba(196,69,105,0.25),
                0 20px 60px rgba(0,0,0,0.6);
            animation: card-pop 0.4s ease;
        }
        @keyframes card-pop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .egg-card .sparkle {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle-float 3s ease-in-out infinite;
        }
        @keyframes sparkle-float {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-14px); opacity: 0.9; }
        }
        .egg-card .star-icon {
            width: 44px; height: 44px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #ffd93d;
            background: radial-gradient(circle at 35% 30%, rgba(255,217,61,0.2), rgba(255,217,61,0.05));
            box-shadow: 0 0 24px rgba(255,217,61,0.3);
        }
        .egg-card h2 {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .egg-card p {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 26px;
            line-height: 1.7;
        }
        .egg-card .btn-row {
            display: flex;
            gap: 12px;
        }
        .egg-card .btn {
            flex: 1;
            padding: 11px 0;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 3px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        .egg-card .btn-yes {
            color: #fff;
            background: linear-gradient(135deg, #ff8fab, #c44569);
            box-shadow: 0 4px 18px rgba(196,69,105,0.4);
        }
        .egg-card .btn-yes:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(196,69,105,0.55); }
        .egg-card .btn-no {
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .egg-card .btn-no:hover { background: rgba(255,255,255,0.14); }

        /* ===== 传送门动画覆盖层 ===== */
        .portal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.9);
            perspective: 1200px;
        }
        .portal-overlay.active { display: flex; }
        .portal-vortex { position: relative; width: 100px; height: 100px; animation: vortex-spin 1.5s linear infinite; }
        @keyframes vortex-spin {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .portal-ring-layer {
            position: absolute;
            top: 50%; left: 50%;
            border-radius: 50%;
            border: 2px solid;
            transform: translate(-50%, -50%);
            animation: portal-expand 2s ease-out forwards;
        }
        @keyframes portal-expand {
            0% { opacity: 1; border-width: 3px; filter: blur(0px); }
            100% { opacity: 0; width: 2000px !important; height: 2000px !important; border-width: 1px; filter: blur(4px); }
        }
        .portal-text {
            position: absolute;
            top: calc(50% + 80px);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            letter-spacing: 4px;
            animation: portal-fade-text 2s ease forwards;
            opacity: 0;
            white-space: nowrap;
        }
        @keyframes portal-fade-text {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            30% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* ===== 隐藏的 Audio 元素 ===== */
        audio { display: none; }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .container { width: 360px; height: 360px; }
            .orbit-ring.outer { width: 300px; height: 300px; }
            .orbit-ring.inner { width: 240px; height: 240px; }
            .center-orb { width: 70px; height: 70px; }
            .orbit-point { width: 30px; height: 30px; margin: -15px 0 0 -15px; }
            .orbit-point .point-inner { width: 10px; height: 10px; }
            .orbit-point .point-label { font-size: 10px; }
            .footer-hint { bottom: 30px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- ===== 星空背景 Canvas ===== -->
    <canvas id="starfield"></canvas>

    <!-- ===== 主容器 ===== -->
    <div class="container" id="mainContainer">
        <div class="orbit-ring outer"></div>
        <div class="orbit-ring inner"></div>

        <!-- 中心光球（视觉焦点） -->
        <div class="center-orb pulsing" id="centerOrb">
            <div class="orb-inner-glow"></div>
        </div>
    </div>

    <!-- ===== 底部提示 ===== -->
    <div class="footer-hint" id="footerHint">点击光点，聆听旋律 · 完整听完或许有惊喜</div>

    <!-- ===== 彩蛋确认弹窗 ===== -->
    <div class="egg-modal" id="eggModal">
        <div class="egg-card">
            <div class="sparkle" style="top:14%;left:18%;background:#ff8fab;"></div>
            <div class="sparkle" style="top:70%;left:82%;background:#ffd93d;animation-delay:0.6s;"></div>
            <div class="sparkle" style="top:20%;left:80%;background:#74b9ff;animation-delay:1.1s;"></div>
            <div class="sparkle" style="top:78%;left:14%;background:#6bffb8;animation-delay:1.6s;"></div>
            <div class="star-icon">✦</div>
            <h2>旋律落幕</h2>
            <p>这段声音已经轻轻结束<br>你是否愿意推开深处的星辰之门？</p>
            <div class="btn-row">
                <button class="btn btn-no" id="btnNo">留在星海</button>
                <button class="btn btn-yes" id="btnYes">进入彩蛋</button>
            </div>
        </div>
    </div>

    <!-- ===== 传送门覆盖层 ===== -->
    <div class="portal-overlay" id="portalOverlay">
        <div class="portal-vortex" id="portalVortex"></div>
        <div class="portal-text">✦ 星辰之门已开启 ✦</div>
    </div>

    <script>
    (function() {
        'use strict';

        // ============================================================
        //  ★ 音频配置 ★
        //  后续添加新音频，只需在此数组中增加一项即可
        //  file: 音频文件名（与 index.html 同目录）
        //  label: 光点悬停时显示的文字
        // ============================================================
        const AUDIO_FILES = [
            { file: 'wanan.m4a', label: '晚安' },
            { file: '1.m4a',    label: '声音 1' },
            { file: '2.m4a',    label: '声音 2' },
            { file: '3.m4a',    label: '声音 3' },
            { file: '4.m4a',    label: '声音 4' },
            { file: '告白.m4a',    label: '告白' },
        ];

        // 颜色盘（循环使用，可自行增删改）
        const COLOR_PALETTE = [
            { bg: '#ff8fab', from: '#ff8fab', to: '#c44569', glow: 'rgba(255,107,157,0.6)' },
            { bg: '#74b9ff', from: '#74b9ff', to: '#0984e3', glow: 'rgba(107,197,255,0.6)' },
            { bg: '#ffd93d', from: '#ffd93d', to: '#f39c12', glow: 'rgba(255,217,61,0.6)' },
            { bg: '#a66cff', from: '#a66cff', to: '#6c5ce7', glow: 'rgba(166,108,255,0.6)' },
            { bg: '#6bffb8', from: '#6bffb8', to: '#00b894', glow: 'rgba(107,255,184,0.6)' },
            { bg: '#ff6b6b', from: '#ff6b6b', to: '#c0392b', glow: 'rgba(255,107,107,0.6)' },
            { bg: '#f368e0', from: '#f368e0', to: '#a832a0', glow: 'rgba(243,104,224,0.6)' },
            { bg: '#ff9ff3', from: '#ff9ff3', to: '#c44569', glow: 'rgba(255,159,243,0.6)' },
        ];

        // ============================================================
        //  常量
        // ============================================================
        const AUDIO_COUNT = AUDIO_FILES.length;
        const ORBIT_RADIUS = 200;
        const ROTATION_SPEED = 0.003;

        // ============================================================
        //  状态
        // ============================================================
        let currentAngle = 0;
        let currentlyPlaying = -1;   // 当前播放的音频索引，-1 = 无
        let portalActive = false;    // 传送门进行中
        let promptDismissed = false; // 本次页面会话中是否已选择"留在星海"（刷新后重置）
        let animFrameId = null;

        // ============================================================
        //  DOM 引用（动态生成）
        // ============================================================
        const points = [];
        const audios = [];
        const container = document.getElementById('mainContainer');
        const footerHint = document.getElementById('footerHint');
        const eggModal = document.getElementById('eggModal');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const portalOverlay = document.getElementById('portalOverlay');
        const portalVortex = document.getElementById('portalVortex');

        // ============================================================
        //  动态生成光点 & Audio 元素
        // ============================================================
        function buildDynamicElements() {
            for (let i = 0; i < AUDIO_COUNT; i++) {
                const c = COLOR_PALETTE[i % COLOR_PALETTE.length];
                const info = AUDIO_FILES[i];

                // --- 光点 DOM ---
                const pt = document.createElement('div');
                pt.className = 'orbit-point';
                pt.id = 'point' + i;
                pt.setAttribute('data-index', i);
                pt.innerHTML =
                    '<div class="point-glow" style="background:radial-gradient(circle,' + c.glow + ',transparent);"></div>' +
                    '<div class="point-body" style="background:radial-gradient(circle at 35% 30%,' + c.from + ',' + c.to + ');color:' + c.bg + ';"></div>' +
                    '<div class="point-inner" style="background:radial-gradient(circle,' + c.bg + ',' + c.from + ');"></div>' +
                    '<span class="point-label">' + escHtml(info.label) + '</span>';
                container.appendChild(pt);
                points[i] = pt;

                // --- Audio 元素 ---
                const au = document.createElement('audio');
                au.id = 'audio' + i;
                au.preload = 'auto';
                var ext = info.file.split('.').pop().toLowerCase();
                var mime = ext === 'mp3' ? 'audio/mpeg' :
                           ext === 'ogg' ? 'audio/ogg' :
                           ext === 'wav' ? 'audio/wav' :
                           ext === 'm4a' ? 'audio/mp4' :
                           ext === 'aac' ? 'audio/aac' : 'audio/mpeg';
                var src = document.createElement('source');
                src.src = info.file;
                src.type = mime;
                au.appendChild(src);
                document.body.appendChild(au);
                audios[i] = au;

                // 完整播放结束 → 弹出彩蛋提示
                au.addEventListener('ended', function(idx) {
                    return function() {
                        points[idx].classList.remove('playing');
                        if (currentlyPlaying === idx) {
                            currentlyPlaying = -1;
                        }
                        // 仅在本次会话未选择"留在星海"时才弹窗
                        if (!promptDismissed && !portalActive) {
                            showEggPrompt();
                        }
                    };
                }(i));

                // 点击播放
                pt.addEventListener('click', function(idx) {
                    return function(e) {
                        e.stopPropagation();
                        toggleAudio(idx);
                    };
                }(i));

                // 播放开始时让底部提示变淡
                au.addEventListener('play', function() {
                    footerHint.classList.add('dim');
                });
                au.addEventListener('pause', function() {
                    footerHint.classList.remove('dim');
                });
                au.addEventListener('ended', function() {
                    footerHint.classList.remove('dim');
                });
            }
        }

        function escHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        // ============================================================
        //  星空背景 Canvas
        // ============================================================
        var starCanvas = document.getElementById('starfield');
        var ctx = starCanvas.getContext('2d');
        var stars = [];
        var starW = 0, starH = 0;

        function resizeStars() {
            starW = window.innerWidth;
            starH = window.innerHeight;
            starCanvas.width = starW;
            starCanvas.height = starH;
            var count = Math.floor((starW * starH) / 3000);
            stars = [];
            for (var i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * starW,
                    y: Math.random() * starH,
                    r: Math.random() * 1.5 + 0.3,
                    a: Math.random() * 0.7 + 0.3,
                    speed: Math.random() * 0.005 + 0.002,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        resizeStars();

        function drawStars(time) {
            ctx.clearRect(0, 0, starW, starH);
            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                var alpha = s.a * (0.6 + 0.4 * Math.sin(time * s.speed + s.phase));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
                ctx.fill();
            }
        }

        // ============================================================
        //  轨道计算 & 更新光点位置
        // ============================================================
        function updateOrbitPositions() {
            var rect = container.getBoundingClientRect();
            var cx = rect.width / 2;
            var cy = rect.height / 2;
            var radius = Math.min(ORBIT_RADIUS, Math.min(cx, cy) * 0.72);
            for (var i = 0; i < AUDIO_COUNT; i++) {
                var angle = currentAngle + (i / AUDIO_COUNT) * Math.PI * 2;
                var x = cx + Math.cos(angle) * radius;
                var y = cy + Math.sin(angle) * radius;
                points[i].style.left = x + 'px';
                points[i].style.top = y + 'px';
            }
        }

        // ============================================================
        //  音频控制
        // ============================================================
        function stopCurrentAudio() {
            if (currentlyPlaying !== -1) {
                audios[currentlyPlaying].pause();
                audios[currentlyPlaying].currentTime = 0;
                points[currentlyPlaying].classList.remove('playing');
                currentlyPlaying = -1;
            }
        }

        function toggleAudio(index) {
            if (currentlyPlaying === index) {
                // 暂停当前
                audios[index].pause();
                points[index].classList.remove('playing');
                currentlyPlaying = -1;
                return;
            }
            // 停止上一个
            stopCurrentAudio();
            // 播放当前
            audios[index].play().then(function() {
                points[index].classList.add('playing');
                currentlyPlaying = index;
            }).catch(function(e) {
                if (e.name !== 'AbortError') {
                    console.warn('Audio play error:', e);
                }
            });
        }

        // ============================================================
        //  彩蛋确认弹窗
        // ============================================================
        function showEggPrompt() {
            eggModal.classList.add('active');
        }
        function hideEggPrompt() {
            eggModal.classList.remove('active');
        }

        // 选择"进入彩蛋"
        btnYes.addEventListener('click', function() {
            hideEggPrompt();
            openPortal();
        });

        // 选择"留在星海" → 本次会话不再弹窗
        btnNo.addEventListener('click', function() {
            promptDismissed = true;
            hideEggPrompt();
            footerHint.textContent = '星辰之门已悄然关闭（刷新后可再次开启）';
            setTimeout(function() {
                footerHint.textContent = '点击光点，聆听旋律 · 完整听完或许有惊喜';
            }, 2500);
            setTimeout(function() {
                footerHint.classList.remove('dim');
            }, 100);
        });

        // ============================================================
        //  传送门动画
        // ============================================================
        function openPortal() {
            portalActive = true;
            stopCurrentAudio();

            // 动态生成传送门环（数量与音频数相同）
            portalVortex.innerHTML = '';
            var portalColors = [];
            for (var i = 0; i < AUDIO_COUNT; i++) {
                portalColors.push(COLOR_PALETTE[i % COLOR_PALETTE.length].bg);
            }
            for (var i = 0; i < AUDIO_COUNT; i++) {
                var ring = document.createElement('div');
                ring.className = 'portal-ring-layer';
                var size = 20 + i * 20;
                ring.style.width = size + 'px';
                ring.style.height = size + 'px';
                ring.style.borderColor = portalColors[i % portalColors.length];
                ring.style.animationDelay = (i * 0.08) + 's';
                portalVortex.appendChild(ring);
            }

            portalOverlay.classList.add('active');

            setTimeout(function() {
                window.location.href = 'egg.html';
            }, 2200);
        }

        // ============================================================
        //  动画循环
        // ============================================================
        function animate(time) {
            drawStars(time);
            currentAngle += ROTATION_SPEED;
            updateOrbitPositions();
            animFrameId = requestAnimationFrame(animate);
        }

        // ============================================================
        //  窗口事件
        // ============================================================
        window.addEventListener('resize', function() {
            resizeStars();
            updateOrbitPositions();
        });

        // ============================================================
        //  启动
        // ============================================================
        buildDynamicElements();

        setTimeout(function() {
            updateOrbitPositions();
        }, 50);

        animFrameId = requestAnimationFrame(animate);

        console.log('here is the voice · 聆听星辰的低语 · 共 ' + AUDIO_COUNT + ' 段音频');
    })();
    </script>
</body>
</html>
