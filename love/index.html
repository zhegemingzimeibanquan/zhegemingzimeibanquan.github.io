<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>here is the voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07070f;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            cursor: default;
        }

        /* ===== 星空背景 Canvas ===== */
        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* ===== 3D 球面粒子 Canvas ===== */
        #orbsphere {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        /* ===== 底部提示 ===== */
        .footer-hint {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: rgba(255,255,255,0.25);
            font-size: 12px;
            letter-spacing: 3px;
            text-align: center;
            transition: opacity 0.6s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .footer-hint.dim { opacity: 0.12; }

        /* ===== 彩蛋弹窗 ===== */
        .egg-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
        }
        .egg-modal.active { display: flex; }
        .egg-card {
            position: relative;
            width: 330px;
            padding: 34px 30px 30px;
            border-radius: 18px;
            text-align: center;
            background: linear-gradient(160deg, rgba(30,20,45,0.95), rgba(12,8,24,0.98));
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 40px rgba(196,69,105,0.25), 0 20px 60px rgba(0,0,0,0.6);
            animation: card-pop 0.4s ease;
        }
        @keyframes card-pop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .egg-card .sparkle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            pointer-events: none; animation: sparkle-float 3s ease-in-out infinite;
        }
        @keyframes sparkle-float { 0%,100% { transform: translateY(0); opacity: 0.3; } 50% { transform: translateY(-14px); opacity: 0.9; } }
        .egg-card .star-icon {
            width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #ffd93d;
            background: radial-gradient(circle at 35% 30%, rgba(255,217,61,0.2), rgba(255,217,61,0.05));
            box-shadow: 0 0 24px rgba(255,217,61,0.3);
        }
        .egg-card h2 { color:#fff; font-size:18px; font-weight:500; letter-spacing:2px; margin-bottom:8px; }
        .egg-card p { color:rgba(255,255,255,0.6); font-size:13px; letter-spacing:1px; margin-bottom:26px; line-height:1.7; }
        .egg-card .btn-row { display: flex; gap: 12px; }
        .egg-card .btn { flex:1; padding:11px 0; border-radius:30px; border:none; cursor:pointer; font-size:14px; letter-spacing:3px; transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease; }
        .egg-card .btn-yes { color:#fff; background:linear-gradient(135deg,#ff8fab,#c44569); box-shadow:0 4px 18px rgba(196,69,105,0.4); }
        .egg-card .btn-yes:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(196,69,105,0.55); }
        .egg-card .btn-no { color:rgba(255,255,255,0.7); background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); }
        .egg-card .btn-no:hover { background:rgba(255,255,255,0.14); }

        /* ===== 传送门动画覆盖层 ===== */
        .portal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; z-index:200;
            display:none; justify-content:center; align-items:center;
            background:rgba(0,0,0,0.9); perspective:1200px;
        }
        .portal-overlay.active { display:flex; }
        .portal-vortex { position:relative; width:100px; height:100px; animation:vortex-spin 1.5s linear infinite; }
        @keyframes vortex-spin { 0%{transform:rotate(0) scale(1);} 100%{transform:rotate(360deg) scale(1);} }
        .portal-ring-layer {
            position:absolute; top:50%; left:50%; border-radius:50%; border:2px solid;
            transform:translate(-50%,-50%); animation: portal-expand 2s ease-out forwards;
        }
        @keyframes portal-expand {
            0% { opacity:1; border-width:3px; filter:blur(0); }
            100% { opacity:0; width:2000px !important; height:2000px !important; border-width:1px; filter:blur(4px); }
        }
        .portal-text {
            position:absolute; top:calc(50% + 80px); left:50%; transform:translateX(-50%);
            color:rgba(255,255,255,0.6); font-size:14px; letter-spacing:4px;
            animation: portal-fade-text 2s ease forwards; opacity:0; white-space:nowrap;
        }
        @keyframes portal-fade-text {
            0%{opacity:0;transform:translateX(-50%) translateY(10px);}
            30%{opacity:1;transform:translateX(-50%) translateY(0);}
            80%{opacity:1;transform:translateX(-50%) translateY(0);}
            100%{opacity:0;transform:translateX(-50%) translateY(-20px);}
        }

        /* ===== 隐藏的 Audio 元素 ===== */
        audio { display: none; }

        @media (max-width: 600px) {
            .footer-hint { bottom: 30px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- ===== 星空背景 Canvas ===== -->
    <canvas id="starfield"></canvas>

    <!-- ===== 3D 球面粒子 Canvas ===== -->
    <canvas id="orbsphere"></canvas>

    <!-- ===== 底部提示 ===== -->
    <div class="footer-hint" id="footerHint">点击光点，聆听旋律 · 完整听完或许有惊喜</div>

    <!-- ===== 彩蛋确认弹窗 ===== -->
    <div class="egg-modal" id="eggModal">
        <div class="egg-card">
            <div class="sparkle" style="top:14%;left:18%;background:#ff8fab;"></div>
            <div class="sparkle" style="top:70%;left:82%;background:#ffd93d;animation-delay:0.6s;"></div>
            <div class="sparkle" style="top:20%;left:80%;background:#74b9ff;animation-delay:1.1s;"></div>
            <div class="sparkle" style="top:78%;left:14%;background:#6bffb8;animation-delay:1.6s;"></div>
            <div class="star-icon">✦</div>
            <h2>旋律落幕</h2>
            <p>这段声音已经轻轻结束<br>你是否愿意推开深处的星辰之门？</p>
            <div class="btn-row">
                <button class="btn btn-no" id="btnNo">留在星海</button>
                <button class="btn btn-yes" id="btnYes">进入彩蛋</button>
            </div>
        </div>
    </div>

    <!-- ===== 传送门覆盖层 ===== -->
    <div class="portal-overlay" id="portalOverlay">
        <div class="portal-vortex" id="portalVortex"></div>
        <div class="portal-text">✦ 星辰之门已开启 ✦</div>
    </div>

    <script>
    (function() {
        'use strict';

        // ============================================================
        //  ★ 音频配置 ★  后续新增音频只需在此增加一项
        //  file: 音频文件名（与 index.html 同目录）
        //  label: 光点悬停时显示的文字
        // ============================================================
        const AUDIO_FILES = [
            { file: 'wanan.m4a', label: '晚安' },
            { file: '1.m4a',    label: '声音 1' },
            { file: '2.m4a',    label: '声音 2' },
            { file: '3.m4a',    label: '声音 3' },
            { file: '4.m4a',    label: '声音 4' },
            { file: '告白.m4a', label: '告白' },
        ];

        // 颜色盘（循环使用）
        const COLOR_PALETTE = [
            { from: '#ff8fab', to: '#c44569', glow: '255,107,157' },
            { from: '#74b9ff', to: '#0984e3', glow: '107,197,255' },
            { from: '#ffd93d', to: '#f39c12', glow: '255,217,61' },
            { from: '#a66cff', to: '#6c5ce7', glow: '166,108,255' },
            { from: '#6bffb8', to: '#00b894', glow: '107,255,184' },
            { from: '#ff6b6b', to: '#c0392b', glow: '255,107,107' },
            { from: '#f368e0', to: '#a832a0', glow: '243,104,224' },
            { from: '#ff9ff3', to: '#c44569', glow: '255,159,243' },
        ];

        const AUDIO_COUNT = AUDIO_FILES.length;
        const PERSPECTIVE = 620;   // 透视深度
        const SPHERE_R = 170;      // 场景球半径
        const ROT_Y_SPEED = 0.002; // 绕 Y 轴转速
        const PITCH = -0.42;       // 固定俯仰角，产生 3D 立体感

        // ============================================================
        //  状态
        // ============================================================
        let currentlyPlaying = -1;   // 当前播放索引，-1 = 无
        let portalActive = false;
        let promptDismissed = false; // 本次会话是否已选"留在星海"
        let hoverIndex = -1;         // 悬停的粒子索引
        let animFrameId = null;
        let yaw = 0;

        // ============================================================
        //  DOM 引用
        // ============================================================
        const footerHint = document.getElementById('footerHint');
        const eggModal = document.getElementById('eggModal');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const portalOverlay = document.getElementById('portalOverlay');
        const portalVortex = document.getElementById('portalVortex');

        // ============================================================
        //  Audio 元素（动态创建）
        // ============================================================
        const audios = [];
        function buildAudioElements() {
            for (let i = 0; i < AUDIO_COUNT; i++) {
                const info = AUDIO_FILES[i];
                const au = document.createElement('audio');
                au.id = 'audio' + i;
                au.preload = 'auto';
                const ext = info.file.split('.').pop().toLowerCase();
                const mime = ext === 'mp3' ? 'audio/mpeg' :
                             ext === 'ogg' ? 'audio/ogg' :
                             ext === 'wav' ? 'audio/wav' :
                             ext === 'm4a' ? 'audio/mp4' :
                             ext === 'aac' ? 'audio/aac' : 'audio/mpeg';
                const src = document.createElement('source');
                src.src = info.file;
                src.type = mime;
                au.appendChild(src);
                document.body.appendChild(au);
                audios[i] = au;

                // 完整播放结束 → 弹窗
                au.addEventListener('ended', function(idx) {
                    return function() {
                        if (currentlyPlaying === idx) currentlyPlaying = -1;
                        if (!promptDismissed && !portalActive) showEggPrompt();
                    };
                }(i));

                // 播放/暂停时底部提示变淡/恢复
                au.addEventListener('play', function(){ footerHint.classList.add('dim'); });
                au.addEventListener('pause', function(){ footerHint.classList.remove('dim'); });
                au.addEventListener('ended', function(){ footerHint.classList.remove('dim'); });
            }
        }

        // ============================================================
        //  粒子数据（斐波那契球面均匀分布）
        // ============================================================
        const particles = [];
        function buildParticles() {
            const golden = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < AUDIO_COUNT; i++) {
                const yy = 1 - (i / Math.max(AUDIO_COUNT - 1, 1)) * 2; // -1..1
                const r = Math.sqrt(1 - yy * yy);
                const theta = i * golden;
                particles.push({
                    px: Math.cos(theta) * r * SPHERE_R,
                    py: yy * SPHERE_R,
                    pz: Math.sin(theta) * r * SPHERE_R,
                    color: COLOR_PALETTE[i % COLOR_PALETTE.length],
                    label: AUDIO_FILES[i].label,
                    // 每帧渲染时更新
                    sx: 0, sy: 0, scale: 1, alpha: 1
                });
            }
        }

        // ============================================================
        //  星空背景 Canvas
        // ============================================================
        const starCanvas = document.getElementById('starfield');
        const sctx = starCanvas.getContext('2d');
        let stars = [], starW = 0, starH = 0;

        function resizeStars() {
            starW = window.innerWidth;
            starH = window.innerHeight;
            starCanvas.width = starW;
            starCanvas.height = starH;
            sctx.setTransform(1, 0, 0, 1, 0, 0);
            const count = Math.floor((starW * starH) / 3000);
            stars = [];
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * starW, y: Math.random() * starH,
                    r: Math.random() * 1.5 + 0.3,
                    a: Math.random() * 0.7 + 0.3,
                    speed: Math.random() * 0.005 + 0.002,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        function drawStars(time) {
            sctx.clearRect(0, 0, starW, starH);
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                const alpha = s.a * (0.6 + 0.4 * Math.sin(time * s.speed + s.phase));
                sctx.beginPath();
                sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                sctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
                sctx.fill();
            }
        }

        // ============================================================
        //  3D 球面粒子 Canvas
        // ============================================================
        const orbCanvas = document.getElementById('orbsphere');
        const octx = orbCanvas.getContext('2d');

        function resizeOrb() {
            orbCanvas.width = window.innerWidth;
            orbCanvas.height = window.innerHeight;
            octx.setTransform(1, 0, 0, 1, 0, 0);
        }
        resizeOrb();
        resizeStars();

        function rotate(x, y, z) {
            // 绕 Y 轴
            const cy = Math.cos(yaw), sy = Math.sin(yaw);
            let x1 = x * cy + z * sy;
            let z1 = -x * sy + z * cy;
            // 绕 X 轴（俯仰）
            const cp = Math.cos(PITCH), sp = Math.sin(PITCH);
            let y2 = y * cp - z1 * sp;
            let z2 = y * sp + z1 * cp;
            return { x: x1, y: y2, z: z2 };
        }

        function drawGlow(x, y, radius, rgb, alpha) {
            const g = octx.createRadialGradient(x, y, 0, x, y, radius);
            g.addColorStop(0, 'rgba(' + rgb + ',' + alpha + ')');
            g.addColorStop(1, 'rgba(' + rgb + ',0)');
            octx.fillStyle = g;
            octx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        }

        // 渲染单帧
        function renderOrb() {
            const W = orbCanvas.width, H = orbCanvas.height;
            const cx = W / 2, cy = H / 2;
            // 按视口收缩场景半径
            const baseRadius = Math.min(SPHERE_R, Math.min(W, H) * 0.34);

            octx.clearRect(0, 0, W, H);

            // 1. 旋转 & 投影所有粒子
            for (let i = 0; i < AUDIO_COUNT; i++) {
                const p = particles[i];
                const s = Math.min(1, baseRadius / SPHERE_R); // 收缩系数
                const r = rotate(p.px * s, p.py * s, p.pz * s);
                const dist = PERSPECTIVE - r.z;          // 视距
                const sc = PERSPECTIVE / dist;           // 透视比例（近大远小）
                const px = cx + r.x * sc;
                const py = cy + r.y * sc;
                // 深度范围近似 [-base, +base]
                const depthNorm = (r.z + baseRadius) / (2 * baseRadius); // 0(远)..1(近)
                const alpha = 0.35 + 0.65 * depthNorm;
                p.sx = px; p.sy = py;
                p.scale = sc;
                p.alpha = alpha;
                p._depth = depthNorm;
                p._base = baseRadius;
            }

            // 2. 深度排序（远的先画）
            const order = particles.slice().sort(function(a, b){ return a._depth - b._depth; });

            // 3. 绘制中心发光球（始终在粒子之下、作为球体中心）
            const isPlayingAny = currentlyPlaying !== -1;
            const time = Date.now() / 1000;
            const coreR = Math.min(46, baseRadius * 0.28);
            const pulse = 0.5 + 0.5 * Math.sin(time * 2.2);
            drawGlow(cx, cy, coreR * 3.2, '196,69,105', 0.14 + 0.10 * pulse);
            const cgrad = octx.createRadialGradient(cx - coreR * 0.3, cy - coreR * 0.3, coreR * 0.1, cx, cy, coreR);
            cgrad.addColorStop(0, '#ff9eb5');
            cgrad.addColorStop(0.6, '#ff6b8a');
            cgrad.addColorStop(1, '#c44569');
            octx.fillStyle = cgrad;
            octx.beginPath();
            octx.arc(cx, cy, coreR, 0, Math.PI * 2);
            octx.fill();

            // 4. 绘制粒子
            for (let i = 0; i < order.length; i++) {
                const p = order[i];
                const isHover = (p === particles[hoverIndex]) && hoverIndex !== -1;
                const isPlay = (p === particles[currentlyPlaying]) && currentlyPlaying !== -1;
                const grow = isHover ? 1.45 : (isPlay ? 1.2 : 1);
                const baseDia = 22 * p.scale * grow;
                const rgb = p.color.glow;

                // 光晕
                drawGlow(p.sx, p.sy, baseDia * 1.7, rgb, 0.16 * p.alpha);

                // 播放光环
                if (isPlay) {
                    const ringR = baseDia * (1.2 + 0.7 * (0.5 + 0.5 * Math.sin(time * 5)));
                    octx.strokeStyle = 'rgba(' + rgb + ',' + (0.5 * p.alpha) + ')';
                    octx.lineWidth = 2;
                    octx.beginPath();
                    octx.arc(p.sx, p.sy, ringR, 0, Math.PI * 2);
                    octx.stroke();
                }

                // 主体（径向渐变圆）
                const grad = octx.createRadialGradient(p.sx - baseDia * 0.25, p.sy - baseDia * 0.25, baseDia * 0.1, p.sx, p.sy, baseDia * 0.5);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.35, p.color.from);
                grad.addColorStop(1, p.color.to);
                octx.globalAlpha = p.alpha;
                octx.fillStyle = grad;
                octx.beginPath();
                octx.arc(p.sx, p.sy, baseDia * 0.5, 0, Math.PI * 2);
                octx.fill();
                octx.globalAlpha = 1;

                // 描边
                octx.strokeStyle = 'rgba(255,255,255,' + (0.25 * p.alpha) + ')';
                octx.lineWidth = 1.2;
                octx.beginPath();
                octx.arc(p.sx, p.sy, baseDia * 0.5, 0, Math.PI * 2);
                octx.stroke();

                // 悬停标签
                if (isHover) {
                    octx.fillStyle = 'rgba(255,255,255,0.9)';
                    octx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
                    octx.textAlign = 'center';
                    octx.fillText(p.label, p.sx, p.sy + baseDia * 0.5 + 18);
                }
            }
        }

        // ============================================================
        //  交互：命中检测
        // ============================================================
        function hitTest(mx, my) {
            for (let i = 0; i < AUDIO_COUNT; i++) {
                const p = particles[i];
                const isPlay = i === currentlyPlaying;
                const baseDia = 22 * p.scale * (isPlay ? 1.2 : 1);
                const hitR = Math.max(baseDia * 0.9, 18);
                const dx = mx - p.sx, dy = my - p.sy;
                if (dx * dx + dy * dy <= hitR * hitR) return i;
            }
            return -1;
        }

        orbCanvas.addEventListener('mousemove', function(e) {
            const rect = orbCanvas.getBoundingClientRect();
            hoverIndex = hitTest(e.clientX - rect.left, e.clientY - rect.top);
            orbCanvas.style.cursor = hoverIndex !== -1 ? 'pointer' : 'default';
        });
        orbCanvas.addEventListener('mouseleave', function() { hoverIndex = -1; });

        orbCanvas.addEventListener('click', function(e) {
            if (portalActive) return;
            const rect = orbCanvas.getBoundingClientRect();
            const idx = hitTest(e.clientX - rect.left, e.clientY - rect.top);
            if (idx !== -1) toggleAudio(idx);
        });

        // ============================================================
        //  音频控制
        // ============================================================
        function stopCurrentAudio() {
            if (currentlyPlaying !== -1) {
                audios[currentlyPlaying].pause();
                audios[currentlyPlaying].currentTime = 0;
                currentlyPlaying = -1;
            }
        }
        function toggleAudio(index) {
            if (currentlyPlaying === index) { stopCurrentAudio(); return; }
            stopCurrentAudio();
            audios[index].play().then(function() {
                currentlyPlaying = index;
            }).catch(function(e) {
                if (e.name !== 'AbortError') console.warn('Audio play error:', e);
            });
        }

        // ============================================================
        //  彩蛋确认弹窗
        // ============================================================
        function showEggPrompt() { eggModal.classList.add('active'); }
        function hideEggPrompt() { eggModal.classList.remove('active'); }

        btnYes.addEventListener('click', function() { hideEggPrompt(); openPortal(); });

        btnNo.addEventListener('click', function() {
            promptDismissed = true;
            hideEggPrompt();
            footerHint.textContent = '星辰之门已悄然关闭（刷新后可再次开启）';
            setTimeout(function() {
                footerHint.textContent = '点击光点，聆听旋律 · 完整听完或许有惊喜';
            }, 2500);
        });

        // ============================================================
        //  传送门动画
        // ============================================================
        function openPortal() {
            portalActive = true;
            stopCurrentAudio();
            portalVortex.innerHTML = '';
            for (let i = 0; i < AUDIO_COUNT; i++) {
                const ring = document.createElement('div');
                ring.className = 'portal-ring-layer';
                const size = 20 + i * 20;
                ring.style.width = size + 'px';
                ring.style.height = size + 'px';
                ring.style.borderColor = COLOR_PALETTE[i % COLOR_PALETTE.length].from;
                ring.style.animationDelay = (i * 0.08) + 's';
                portalVortex.appendChild(ring);
            }
            portalOverlay.classList.add('active');
            setTimeout(function() { window.location.href = 'egg.html'; }, 2200);
        }

        // ============================================================
        //  主循环
        // ============================================================
        function loop(time) {
            drawStars(time);
            yaw += ROT_Y_SPEED;
            renderOrb();
            animFrameId = requestAnimationFrame(loop);
        }

        function onResize() {
            resizeStars();
            resizeOrb();
        }
        window.addEventListener('resize', onResize);

        // ============================================================
        //  启动
        // ============================================================
        buildAudioElements();
        buildParticles();
        animFrameId = requestAnimationFrame(loop);
